<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>紙上塔羅｜聖三角占卜</title>
  <meta name="description" content="一本紙上的塔羅手帳：寫下問題，抽三張牌，讀整副牌的結構。">
  <meta name="theme-color" content="#f6f1e7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232c3550'/%3E%3Cpath d='M16 5l2.6 8.4L27 16l-8.4 2.6L16 27l-2.6-8.4L5 16l8.4-2.6z' fill='%23b38a3a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <span class="stamp" aria-hidden="true">占</span>
      <p class="masthead__date" id="today"></p>
      <h1>紙上塔羅</h1>
      <p class="masthead__en">Tarot on Paper</p>
      <svg class="ornament" viewBox="0 0 224 24" aria-hidden="true">
        <path d="M4 12h70M150 12h70"/>
        <path d="M92 5a8 8 0 1 0 0 14 6 6 0 1 1 0-14zM132 5a8 8 0 1 1 0 14 6 6 0 1 0 0-14z"/>
        <path class="dot" d="M112 3l2.2 6.8L121 12l-6.8 2.2L112 21l-2.2-6.8L103 12l6.8-2.2z"/>
        <circle class="dot" cx="4" cy="12" r="1.6"/><circle class="dot" cx="220" cy="12" r="1.6"/>
      </svg>
      <p class="masthead__sub">寫下一個問題，抽三張牌，慢慢讀。</p>
    </header>

    <!-- 第一步：提問 -->
    <section class="step narrow" id="step-ask">
      <div class="step__head"><span class="step__no">一</span><h2>想問什麼</h2></div>
      <div class="sheet">
        <label class="field">
          <span class="field__label">把問題寫下來。問得越具體，牌越好讀。</span>
          <textarea id="question" rows="3" maxlength="200" placeholder="例如：我該不該接下這份新工作？"></textarea>
        </label>

        <fieldset class="choices">
          <legend>三張牌要怎麼讀</legend>
          <label class="choice">
            <input type="radio" name="spread" value="time" checked>
            <span class="choice__body"><strong>時間之流</strong><em>過去・現在・未來</em><small>想看一件事怎麼走到現在、又會往哪裡去。</small></span>
          </label>
          <label class="choice">
            <input type="radio" name="spread" value="insight">
            <span class="choice__body"><strong>問題解析</strong><em>狀況・癥結・建議</em><small>想弄清楚卡在哪裡、接下來能怎麼做。</small></span>
          </label>
        </fieldset>

        <label class="toggle">
          <input type="checkbox" id="reversals" checked>
          <span>使用逆位</span>
        </label>

        <div class="actions"><button class="btn" id="btn-shuffle" type="button">洗牌</button></div>
      </div>
    </section>

    <!-- 第二步：選牌 -->
    <section class="step" id="step-pick" hidden>
      <div class="step__head"><span class="step__no">二</span><h2>選三張牌</h2></div>
      <p class="note" id="pick-hint" aria-live="polite"></p>
      <div class="picked" id="picked" aria-hidden="true"></div>
      <div class="fan" id="fan"></div>
      <div class="actions"><button class="btn btn--quiet" id="btn-reshuffle" type="button">重新洗牌</button></div>
    </section>

    <!-- 第三步：解讀 -->
    <section class="step" id="step-read" hidden>
      <div class="step__head"><span class="step__no">三</span><h2>牌面</h2></div>
      <blockquote class="asked narrow" id="asked"></blockquote>
      <div class="spread" id="spread"></div>
      <div class="actions"><button class="btn" id="btn-reveal" type="button">翻牌</button></div>

      <div class="narrow" id="reading" hidden>
        <section class="block">
          <h3>整副牌的樣子</h3>
          <div class="elements" id="elements"></div>
          <p id="overview"></p>
        </section>
        <section class="block">
          <h3>逐張來看</h3>
          <div id="positions"></div>
        </section>
        <section class="block">
          <h3>牌與牌之間</h3>
          <p id="links"></p>
          <p id="closing"></p>
        </section>
        <section class="block block--ai tape" id="ai-block" hidden>
          <h3>Fable 的解讀</h3>
          <p class="note" id="ai-status" aria-live="polite"></p>
          <div class="ai-text" id="ai-text"></div>
        </section>
        <p class="disclaimer">塔羅是整理思緒的工具，不是預言。健康、法律與財務上的重大決定，請找專業的人談。</p>
        <div class="actions"><button class="btn btn--quiet" id="btn-again" type="button">再問一個問題</button></div>
      </div>
    </section>

    <footer class="colophon">牌面為原創線稿<br>解牌依據：整體印象・大小牌比例・元素過與不及・相鄰元素生剋・逆位</footer>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
